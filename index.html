<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="우리집">
<meta name="theme-color" content="#2F7A6B">
<title>우리집 스케줄</title>
<style>
  html,body{margin:0; padding:0; background:#F4F5F2;
    -webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="fam">
  <header class="top">
    <div class="dnav">
      <button class="dbtn" id="prevD" type="button">‹</button>
      <h1 id="dateline">오늘</h1>
      <button class="dbtn" id="nextD" type="button">›</button>
      <button class="dbtn today" id="todayD" type="button" hidden>오늘</button>
    </div>
  </header>

  <div class="bar">
    <span class="barNow" id="nowMain">—</span>
    <button class="barLoc" id="shareBtn" type="button">링크 복사</button>
    <a class="barLoc" href="https://www.google.com/maps" target="_blank" rel="noopener">지도</a>
  </div>


  <div class="bday" id="bdayCard" hidden><span id="bdayName"></span></div>


  <details class="card prog fold" id="progCard" hidden open>
    <summary>아빠의 12주</summary>
    <div class="pgRow">
      <div class="pgItem"><span class="pgN" id="pgW">—</span><span class="pgL">kg</span></div>
      <div class="pgBar"><div class="pgFill" id="pgFill"></div></div>
      <div class="pgItem"><span class="pgN" id="pgD">—</span><span class="pgL">kg 감량</span></div>
    </div>
    <div class="pgDryBox">
      <span class="pgDryN" id="pgDry">0</span>
      <span class="pgDryL">일 <b>연속 술 안 마심</b></span>
      <span class="pgWkS"><span id="pgBest"></span> · <span id="pgWk"></span></span>
    </div>
    <div class="pgDryBox gym">
      <span class="pgDryN" id="pgGym">0</span>
      <span class="pgDryL">일 <b>연속 운동</b></span>
      <span class="pgWkS"><span id="pgGymBest"></span></span>
    </div>
  </details>

  <details class="card fold" open><summary>오늘 하루 시간표</summary>
    <table class="mini" id="today"></table>
    <details class="more" id="dayMore" hidden>
      <summary id="daySum">하루 전체 보기</summary>
      <table class="mini" id="todayAll"></table>
    </details>
  </details>


  <details class="card fold" open>
    <summary>근무표</summary>
    <div class="wkHead">
      <button class="nav" id="prevW" type="button">‹</button>
      <h2 id="wkTitle">이번 주 근무</h2>
      <button class="nav" id="nextW" type="button">›</button>
      <button class="nav mtoggle" id="mToggle" type="button">▦</button>
    </div>
    <div id="week"></div>
    <div id="monthWrap" hidden>
      <div class="mgrid" id="month"></div>
      <div class="mlgd">
        <span><i class="ms d"></i>정상</span>
        <span><i class="ms w"></i>새벽</span>
        <span><i class="ms p"></i>오후</span>
        <span><i class="ms o"></i>휴무</span>
        <span class="mnote">아래 보라 글씨는 엄마</span>
      </div>
    </div>
  </details>

  <details class="card fold" open>
    <summary>일정</summary>
    <div id="meets"></div>
    <details class="more" id="meetMore" hidden>
      <summary id="meetSum">더 보기</summary>
      <div id="meetsLater"></div>
    </details>
  </details>

  <details class="card fold" open>
    <summary>할 일</summary>
    <div id="todoTop"></div>
    <details class="more"><summary id="todoSum">더 보기</summary>
      <div id="todo"></div>
    </details>
  </details>

  <details class="card fold"><summary id="examSum">아이들 시험 일정</summary>
    <div id="exams"></div>
    <details class="more" id="examMore" hidden>
      <summary id="examMoreSum">나머지 보기</summary>
      <div id="examsLater"></div>
    </details>
  </details>

  <details class="card fold" open>
    <summary>다가오는 날</summary>
    <div id="upcoming"></div>
    <details class="more" id="moreWrap" hidden>
      <summary id="moreSum">내년 일정 더 보기</summary>
      <div id="upcomingLater"></div>
    </details>
  </details>

  <details class="card fold">
    <summary>직접 넣기</summary>

    <div class="inGrp">일정 추가</div>
    <div class="inRow">
      <input type="date" id="inDate">
      <input type="time" id="inTime">
    </div>
    <div class="inRow2">
      <input type="text" id="inText" placeholder="내용 (예: 친구 모임)">
      <button class="inBtn" id="inAdd" type="button">추가</button>
    </div>

    <div class="inGrp">근무 지정</div>
    <div class="inRow2">
      <input type="date" id="wkDate">
    </div>
    <div class="wkBtns">
      <button class="inSm" data-w="day" type="button">정상</button>
      <button class="inSm" data-w="dawn" type="button">새벽</button>
      <button class="inSm" data-w="pm" type="button">오후</button>
      <button class="inSm" data-w="off" type="button">휴무</button>
    </div>

    <div class="inGrp">할 일 추가</div>
    <div class="inRow2">
      <input type="text" id="tdText" placeholder="할 일">
      <button class="inBtn" id="tdAdd" type="button">추가</button>
    </div>

    <div class="inGrp">지우기</div>
    <div class="inRow2">
      <button class="inBtn wide" id="delMeet" type="button">일정 지우기</button>
      <button class="inBtn wide" id="delTodo" type="button">할 일 지우기</button>
    </div>
    <div class="status" id="inMsg"></div>
  </details>

  <details class="card fold" open>
    <summary>오늘 기록</summary>
    <div class="drinks" id="drinks">
      <button class="d v0" data-v="0" type="button"><b>안 마심</b><i>0잔</i></button>
      <button class="d v1" data-v="1" type="button"><b>절반</b><i>평소의 ½</i></button>
      <button class="d v2" data-v="2" type="button"><b>평소</b><i>늘 마시던</i></button>
      <button class="d v3" data-v="3" type="button"><b>더</b><i>평소보다</i></button>
    </div>

    <div class="wbox">
      <button class="stp" id="wMinus" type="button">−</button>
      <div class="wmid">
        <input type="number" step="1" inputmode="numeric" id="w" placeholder="0">
        <span class="wunit">kg</span>
      </div>
      <button class="stp" id="wPlus" type="button">＋</button>
    </div>

    <div class="nums">
      <label>혈압 (위)<input type="number" inputmode="numeric" id="sys" placeholder="130"></label>
      <label>혈압 (아래)<input type="number" inputmode="numeric" id="dia" placeholder="85"></label>
      <label>잠 (시간)<input type="number" step="0.5" inputmode="decimal" id="sleep" placeholder="7"></label>
      <label class="lblank">&nbsp;<span class="wtoday" id="wDelta"></span></label>
    </div>
    <div class="checks" id="checks"></div>
    <button id="save" class="save">오늘 기록 저장</button>
    <div class="status" id="status"></div>
  </details>

  <details class="card fold"><summary>기록 통계</summary>
    <div id="statSum" class="statSum"></div>
    <div id="statChart" class="statChart"></div>
    <table class="statTbl" id="statTbl"></table>
    <button class="bk" id="csvOut" type="button">표로 내보내기 (엑셀·병원용)</button>
    <textarea id="csvBox" hidden rows="5" readonly></textarea>
  </details>

  <details class="card fold"><summary>90일 지도</summary>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="sw2 l0"></i>안 마심</span>
      <span><i class="sw2 l1"></i>절반</span>
      <span><i class="sw2 l2"></i>평소</span>
      <span><i class="sw2 l3"></i>더</span>
    </div>
    <div class="tally" id="tally"></div>
  </details>


  <p class="foot">근무가 바뀌면 새 파일을 보내드릴게요.</p>
</div>

<style>
  #fam{
    --paper:#F4F5F2; --ink:#17231F; --ink2:#4A5A54; --line:#DDE2DC;
    --jade:#2F7A6B; --jade-l:#E4EFEB; --clay:#9E4238; --gold:#B8791F;
    background:var(--paper); color:var(--ink); padding:14px 12px 30px;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:14px; line-height:1.55; max-width:560px; margin:0 auto;
    -webkit-text-size-adjust:100%;
  }
  #fam *{box-sizing:border-box}
  .top{padding:2px 2px 10px}
  .dnav{display:flex; align-items:center; gap:7px}
  .dnav h1{flex:1}
  .dbtn{width:30px; height:30px; border:1px solid var(--line); background:#fff;
    border-radius:8px; font-size:17px; color:var(--jade); cursor:pointer;
    font-family:inherit; line-height:1; flex:none}
  .dbtn.today{width:auto; padding:0 10px; font-size:12px; font-weight:700}
  .dbtn:active{background:var(--jade-l)}
  .eyebrow{font-size:12px; letter-spacing:.18em; color:var(--jade); font-weight:700}
  h1{font-size:18px; margin:2px 0 0; font-weight:800; letter-spacing:-.02em}
  .bar{display:flex; align-items:center; gap:7px; background:var(--jade); color:#fff;
    border-radius:11px; padding:10px 12px; margin-bottom:10px}
  .barNow{font-size:14px; font-weight:700; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  button.barLoc{border:none; font-family:inherit; cursor:pointer}
  .barLoc{font-size:12px; font-weight:700; color:#fff; text-decoration:none;
    background:rgba(255,255,255,.22); padding:6px 10px; border-radius:16px;
    white-space:nowrap}
  .card{background:#fff; border:1px solid var(--line); border-radius:13px;
    padding:13px; margin-bottom:10px}
  h2{font-size:13px; margin:0 0 12px; font-weight:700; color:var(--ink2);
    letter-spacing:.06em}
  .bday{background:#FFF6E5; border:1px solid #E8D5AA; color:#8A6316; font-weight:700;
    font-size:13px; border-radius:10px; padding:10px 12px; margin-bottom:10px;
    text-align:center}
  .wtag i{font-style:normal; font-weight:600; opacity:.75; font-size:11.5px}
  .wtag.mtag{background:#EFE6F2; color:#6B4E7A}
  .wtag.mtag.off{background:#F0F0EE; color:var(--ink2)}
  .prog .pgRow{display:flex; align-items:center; gap:11px}
  .pgItem{display:flex; align-items:baseline; gap:3px; flex:none}
  .pgN{font-size:22px; font-weight:800; color:var(--jade); line-height:1}
  .pgL{font-size:11px; color:var(--ink2)}
  .pgBar{flex:1; height:7px; background:var(--line); border-radius:6px;
    overflow:hidden}
  .pgFill{height:100%; background:var(--jade); border-radius:6px; width:0%}
  .pgDryBox{display:flex; align-items:baseline; gap:6px; margin-top:9px;
    padding:11px 13px; background:var(--jade); border-radius:12px; color:#fff}
  .pgDryBox.gym{background:#4A6FA5}
  .pgDryN{font-size:32px; font-weight:800; line-height:1}
  .pgDryL{font-size:14px; opacity:.92}
  .pgDryL b{font-weight:800; opacity:1}
  .pgWkS{margin-left:auto; font-size:12px; opacity:.8}
  .mini{width:100%; border-collapse:collapse; font-size:14px}
  .mini td{padding:8px 0; vertical-align:top; border-bottom:1px solid var(--line)}
  .mini td:first-child{width:58px; color:var(--jade); font-weight:700; font-size:14px}
  .mini tr:last-child td{border-bottom:none}
  .mini tr.on td{background:var(--jade-l); font-weight:700}
  td.edit, td.edtime{cursor:pointer}
  td.edtime.ed{color:var(--clay)}
  td.edit.ed{color:var(--jade); font-weight:700}
  td.edit.ed::after{content:" ✎"; font-size:11px; opacity:.7}
  .inGrp{font-size:12px; font-weight:800; color:var(--jade); margin:14px 0 6px;
    letter-spacing:.05em}
  .inGrp:first-of-type{margin-top:2px}
  .inRow{display:grid; grid-template-columns:1fr 1fr; gap:7px}
  .inRow2{display:flex; gap:7px; margin-top:7px}
  .inRow input, .inRow2 input{flex:1; min-width:0; font-family:inherit; font-size:15px;
    padding:10px; border:1.5px solid var(--line); border-radius:9px; color:var(--ink)}
  .inRow input:focus, .inRow2 input:focus{outline:none; border-color:var(--jade)}
  .inBtn{flex:none; padding:10px 15px; font-size:14px; font-weight:700;
    background:var(--jade); color:#fff; border:none; border-radius:9px;
    cursor:pointer; font-family:inherit}
  .inBtn.wide{flex:1; background:#fff; color:var(--ink2);
    border:1.5px solid var(--line)}
  .wkBtns{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:7px}
  .inSm{padding:11px 4px; font-size:13px; font-weight:700; border:1.5px solid var(--line);
    background:#fff; color:var(--ink); border-radius:9px; cursor:pointer;
    font-family:inherit}
  .inSm:active{background:var(--jade-l)}
  .drinks{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
  .d{display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; padding:12px 4px; border:1.5px solid var(--line); background:#fff;
    border-radius:12px; cursor:pointer; font-family:inherit; transition:.12s}
  .d b{font-size:14px; font-weight:800; color:var(--ink)}
  .d i{font-size:10px; font-style:normal; color:#9AA39D}
  .d::before{content:''; width:100%; height:3px; border-radius:3px; margin-bottom:3px}
  .d.v0::before{background:#2F7A6B} .d.v1::before{background:#8FAE6E}
  .d.v2::before{background:#D8A038} .d.v3::before{background:#9E4238}
  .d.on{border-width:2px; transform:translateY(-1px)}
  .d.v0.on{border-color:#2F7A6B; background:#EAF3F0}
  .d.v1.on{border-color:#8FAE6E; background:#F0F5E8}
  .d.v2.on{border-color:#D8A038; background:#FBF3E2}
  .d.v3.on{border-color:#9E4238; background:#F9EBEA}
  .d.on b{color:var(--ink)}
  .wbox{display:flex; align-items:center; gap:9px; margin-top:12px;
    background:var(--jade-l); border-radius:13px; padding:9px 10px}
  .stp{width:38px; height:38px; border:none; border-radius:10px; background:#fff;
    color:var(--jade); font-size:19px; font-weight:800; cursor:pointer;
    font-family:inherit; flex:none; line-height:1}
  .stp:active{background:#DCEAE5}
  .wmid{flex:1; display:flex; align-items:baseline; justify-content:center; gap:4px}
  .wmid input{width:96px; border:none; background:transparent; text-align:right;
    font-family:inherit; font-size:29px; font-weight:800; color:var(--ink);
    padding:0; -moz-appearance:textfield}
  .wmid input::-webkit-outer-spin-button,
  .wmid input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .wmid input:focus{outline:none}
  .wunit{font-size:14px; font-weight:700; color:var(--jade)}
  .nums{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:9px}
  .nums label{font-size:10.5px; color:var(--ink2); display:flex; flex-direction:column; gap:3px}
  .nums input{font-family:inherit; font-size:15px; padding:9px 6px; text-align:center;
    border:1.5px solid var(--line); border-radius:9px; width:100%; color:var(--ink)}
  .nums input:focus{outline:none; border-color:var(--jade)}
  .lblank{justify-content:flex-end}
  .wtoday{font-size:12px; font-weight:800; color:var(--jade); text-align:center;
    padding:9px 0}
  .checks{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px}
  .ck{display:flex; align-items:center; gap:6px; padding:9px; font-size:13px;
    border:1.5px solid var(--line); border-radius:9px; background:#fff; cursor:pointer;
    font-family:inherit; color:var(--ink); text-align:left; width:100%; font-weight:600}
  .ck .box{width:16px; height:16px; border-radius:5px; border:1.5px solid var(--line);
    flex:none; display:grid; place-items:center; font-size:10px; color:#fff}
  .ck.on{border-color:var(--jade); background:var(--jade-l)}
  .ck.on .box{background:var(--jade); border-color:var(--jade)}
  .save{width:100%; margin-top:10px; padding:14px; font-size:15px; font-weight:700;
    background:var(--ink); color:#fff; border:none; border-radius:10px; cursor:pointer;
    font-family:inherit}
  .status{font-size:12px; color:var(--jade); margin-top:7px; min-height:16px; font-weight:700}
  .statSum{display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--ink2);
    margin-bottom:12px}
  .statSum b{font-size:19px; font-weight:800; color:var(--ink)}
  .statChart{display:flex; align-items:flex-end; gap:3px; height:70px;
    border-bottom:1px solid var(--line); margin-bottom:4px}
  .sbar{flex:1; background:var(--jade); border-radius:2px 2px 0 0; min-height:2px}
  .statTbl{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px}
  .statTbl th{font-size:11px; color:var(--ink2); font-weight:700; padding:6px 2px;
    border-bottom:1px solid var(--line); text-align:center}
  .statTbl td{padding:7px 2px; text-align:center; border-bottom:1px solid var(--line)}
  .statTbl td:first-child{font-weight:700; color:var(--jade); text-align:left}
  .bk{width:100%; padding:11px; font-size:13px; font-weight:700; margin-top:11px;
    border:1.5px solid var(--line); background:#fff; color:var(--ink2);
    border-radius:9px; cursor:pointer; font-family:inherit}
  #csvBox{width:100%; margin-top:8px; font-family:monospace; font-size:10px;
    padding:8px; border:1.5px solid var(--line); border-radius:8px}
  .grid{display:grid; grid-template-columns:repeat(15,1fr); gap:3px}
  .cell{aspect-ratio:1; border-radius:3px; background:#E6E9E4}
  .cell.f0{background:#2F7A6B} .cell.f1{background:#8FAE6E}
  .cell.f2{background:#D8A038} .cell.f3{background:#9E4238}
  .cell.future{background:transparent; border:1px solid #E6E9E4}
  .cell.tdy{box-shadow:0 0 0 2px var(--ink)}
  .legend{display:flex; flex-wrap:wrap; gap:9px; margin-top:10px; font-size:11px;
    color:var(--ink2)}
  .legend span{display:flex; align-items:center; gap:3px}
  .sw2{width:10px; height:10px; border-radius:3px; display:inline-block}
  .sw2.l0{background:#2F7A6B} .sw2.l1{background:#8FAE6E}
  .sw2.l2{background:#D8A038} .sw2.l3{background:#9E4238}
  .tally{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
    font-size:13px; display:flex; flex-wrap:wrap; gap:12px}
  .tally b{font-size:17px; font-weight:800}
  .mtoggle{font-size:14px}
  .mtoggle.on{background:var(--jade); color:#fff; border-color:var(--jade)}
  .mgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
  .mh{text-align:center; font-size:10px; font-weight:700; color:var(--ink2); padding:2px 0}
  .mh.s0{color:var(--clay)}
  .mc{aspect-ratio:1/1.25; border:1px solid var(--line); border-radius:5px;
    padding:2px 1px; display:flex; flex-direction:column; align-items:center;
    gap:1px; background:#fff}
  .mc.empty{border:none; background:transparent}
  .mc.tdy2{border-color:var(--ink); border-width:2px; background:var(--jade-l)}
  .mc.dim{opacity:.45}
  .mcd{font-size:9.5px; color:var(--ink2); line-height:1}
  .mcd.sun{color:var(--clay)}
  .mcp{font-size:11px; font-weight:800; line-height:1.1}
  .mcm{font-size:9px; color:#6B4E7A; font-weight:700; line-height:1}
  .mcE{font-size:7px; color:var(--jade); line-height:1}
  .p-day{color:#1F6F5C} .p-dawn{color:#2E5C8A}
  .p-pm{color:#B8791F} .p-off{color:#B0B6B1}
  .mlgd{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; font-size:10.5px;
    color:var(--ink2); align-items:center}
  .mlgd span{display:flex; align-items:center; gap:3px}
  .ms{width:8px; height:8px; border-radius:2px; display:inline-block}
  .ms.d{background:#1F6F5C} .ms.w{background:#2E5C8A}
  .ms.p{background:#B8791F} .ms.o{background:#B0B6B1}
  .mnote{color:#6B4E7A}
  .wkHead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
  .wkHead h2{flex:1; text-align:center; margin:0}
  .nav{width:30px; height:30px; border:1px solid var(--line); background:#fff;

redrawDay = function(){
  var evs = MEETS.filter(function(e){ return e[0] === today && e[1]; });
  var aps2 = MEETS.filter(function(e){ return e[0] === today; })
    .map(function(e){ return [e[1] || '', '★ ' + e[2], 1]; });
  var pl0 = (rec.plan && rec.plan[today]) || {};

  // 일정과 겹치는 기본 활동은 빼기 (앞뒤 90분)
  function toMin(t){
    var p = (t||'').split(':');
    return p.length === 2 ? (+p[0]*60 + +p[1]) : -9999;
  }
  var KEEP = /일어남|아침|점심|저녁|잠|근무 시작|퇴근|도시락|혈압약/;
  var base = info.rows.filter(function(r){
    if(KEEP.test(r[1])) return true;
    var rm = toMin((pl0[r[0]] && pl0[r[0]].t) || r[0]);
    for(var i=0;i<evs.length;i++){
      if(Math.abs(rm - toMin(evs[i][1])) < 90) return false;
    }
    return true;
  });

  var rows = base.map(function(r){ return [r[0], r[1], 0]; }).concat(aps2);
  rows.sort(function(a,b){
    var ta = (pl0[a[0]] && pl0[a[0]].t) || a[0];
    var tb = (pl0[b[0]] && pl0[b[0]].t) || b[0];
    return ta < tb ? -1 : (ta > tb ? 1 : 0);
  });
  function trs(list){
    return list.map(function(r){
      var on = cur && r[2] === 0 && r[0] === cur[0];
      var pl = (rec.plan && rec.plan[today]) || {};
      var e2 = pl[r[0]];

        + '<td class="edit'+(e2&&e2.x?' ed':'')+'" data-t="'+r[0]+'" data-o="'
        + r[1].replace(/"/g,'') + '">'+txt+'</td></tr>';
    }).join('');
  }
  var ci = 0;
  rows.forEach(function(r,i){
    var pt = r[0].split(':');
    if(pt.length === 2 && (+pt[0]*60 + +pt[1]) <= nowMin) ci = i;
  });
  var st = Math.max(0, Math.min(ci - 2, rows.length - 5));
  document.getElementById('today').innerHTML = trs(rows.slice(st, st + 5));
  if(rows.length > 5){
    document.getElementById('dayMore').hidden = false;
    document.getElementById('todayAll').innerHTML = trs(rows);

}
function curDay(){
  if(!rec.days[today]) rec.days[today] = {drink:null, checks:[], memo:''};
  if(!rec.days[today].checks) rec.days[today].checks = [];
  return rec.days[today];
}
function dstr(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); return ymd(x); }

function recRender(){
  var d = curDay();
  var bs = document.querySelectorAll('.d');
  for(var i=0;i<bs.length;i++)
    bs[i].classList.toggle('on', d.drink !== null && +bs[i].dataset.v === d.drink);

  var box = document.getElementById('checks');
  if(!box.dataset.built){
    CHECKS.forEach(function(label, idx){
      var b = document.createElement('button');
      b.className = 'ck'; b.type = 'button';
      b.innerHTML = '<span class="box">✓</span>' + label;
      b.onclick = function(){
        var c = curDay().checks, pos = c.indexOf(idx);
        if(pos > -1) c.splice(pos,1); else c.push(idx);
        recRender();
      };
      box.appendChild(b);
    });
    box.dataset.built = '1';
  }
  Array.prototype.forEach.call(box.children, function(b, idx){
    b.classList.toggle('on', d.checks.indexOf(idx) > -1);
  });

  ['w','sys','dia','sleep'].forEach(function(id){
    var el = document.getElementById(id);
    if(el && document.activeElement !== el) el.value = d[id] == null ? '' : d[id];
  });

  var sd = new Date(+rec.start.split('-')[0], +rec.start.split('-')[1]-1, +rec.start.split('-')[2]);
  var g = document.getElementById('grid');
  var html = '', zero = 0, logged = 0;
  for(var i=0;i<90;i++){
    var k = dstr(sd, i), r2 = rec.days[k];
    var cls = 'cell';
    if(r2 && r2.drink !== null && r2.drink !== undefined){
      cls += ' f' + r2.drink; logged++;
      if(r2.drink === 0) zero++;
    } else if(new Date(k) > new Date(today)) cls += ' future';
    if(k === today) cls += ' tdy';
    html += '<div class="'+cls+'"></div>';
  }
  g.innerHTML = html;
  var dayn = Math.round((new Date(today) - sd)/86400000) + 1;
  document.getElementById('tally').innerHTML =
    '<span><b>'+zero+'</b>일 안 마심</span><span><b>'+logged+'</b>일 기록</span>'
    + '<span><b>'+dayn+'</b>일째</span>';

  var ks = Object.keys(rec.days).sort().filter(function(k){
    return rec.days[k] && rec.days[k].w && k < today;
  });
  var el2 = document.getElementById('wDelta');
  if(el2){
    if(d.w && ks.length){
      var pv = rec.days[ks[ks.length-1]].w;
      var df = Math.round(d.w - pv);
      el2.textContent = df === 0 ? '변화 없음' : (df > 0 ? '+'+df+'kg' : df+'kg');
      el2.style.color = df > 0 ? '#9E4238' : '#2F7A6B';
    } else el2.textContent = '';
  }

  drawStats();
  recSummary();
}

function drawStats(){
  var sd = new Date(+rec.start.split('-')[0], +rec.start.split('-')[1]-1, +rec.start.split('-')[2]);
  var ks = Object.keys(rec.days).sort();
  if(!ks.length){
    document.getElementById('statSum').innerHTML = '<span>아직 기록이 없습니다</span>';
    document.getElementById('statTbl').innerHTML = '';
    document.getElementById('statChart').innerHTML = '';
    return;
  }
  var weeks = {};
  ks.forEach(function(k){
    var d = new Date(+k.split('-')[0], +k.split('-')[1]-1, +k.split('-')[2]);
    var wi = Math.floor((d - sd)/86400000/7);
    if(wi < 0) return;
    if(!weeks[wi]) weeks[wi] = {dry:0, drank:0, ws:[], gym:0, days:0};
    var r = rec.days[k];
    weeks[wi].days++;
    if(r.drink === 0) weeks[wi].dry++;
    else if(r.drink > 0) weeks[wi].drank++;
    if(r.w) weeks[wi].ws.push(r.w);
    if(r.checks && r.checks.indexOf(3) > -1) weeks[wi].gym++;
  });

  var allW = [], dryTotal = 0, gymTotal = 0, logged = 0;
  ks.forEach(function(k){
    var r = rec.days[k];
    if(r.w) allW.push(r.w);
    if(r.drink === 0) dryTotal++;
    if(r.drink !== null && r.drink !== undefined) logged++;
    if(r.checks && r.checks.indexOf(3) > -1) gymTotal++;
  });
  var lost = allW.length > 1 ? Math.round(allW[0] - allW[allW.length-1]) : 0;
  document.getElementById('statSum').innerHTML =
    '<span><b>'+logged+'</b>일 기록</span>'
    + '<span>술 안 마심 <b>'+dryTotal+'</b>일</span>'
    + '<span>운동 <b>'+gymTotal+'</b>일</span>'
    + '<span>감량 <b>'+lost+'</b>kg</span>';

  var mx = Math.max.apply(null, allW.concat([1]));
  var mn = Math.min.apply(null, allW.concat([mx]));
  var rng = Math.max(1, mx - mn);
  document.getElementById('statChart').innerHTML = allW.map(function(w){
    var h = 10 + ((w - mn)/rng)*88;
    return '<div class="sbar" style="height:'+h.toFixed(0)+'%" title="'+w+'kg"></div>';
  }).join('');

  var rows = '<tr><th>주차</th><th>기록</th><th>안 마심</th><th>체중</th><th>헬스</th></tr>';
  Object.keys(weeks).sort(function(a,b){ return a-b; }).forEach(function(wi){
    var w = weeks[wi];
    var wtxt = w.ws.length
      ? (w.ws.length > 1 ? w.ws[0]+'→'+w.ws[w.ws.length-1] : ''+w.ws[0])
      : '-';
    rows += '<tr><td>'+(+wi+1)+'주</td><td>'+w.days+'일</td><td>'+w.dry+'일</td>'
      + '<td>'+wtxt+'</td><td>'+w.gym+'일</td></tr>';
  });
  document.getElementById('statTbl').innerHTML = rows;
}

function recSummary(){
  var ws = [];
  Object.keys(rec.days).sort().forEach(function(k){
    if(rec.days[k] && rec.days[k].w) ws.push(rec.days[k].w);
  });
  if(!ws.length){ document.getElementById('progCard').hidden = true; return; }
  var first = ws[0], nw = ws[ws.length-1], lost = Math.round(first-nw);
  var pct = Math.max(0, Math.min(100, (first-nw)/(first-88)*100));
  document.getElementById('progCard').hidden = false;
  document.getElementById('pgW').textContent = nw;
  document.getElementById('pgD').textContent = lost > 0 ? lost : 0;
  document.getElementById('pgFill').style.width = pct.toFixed(0)+'%';
  var sd = new Date(+rec.start.split('-')[0], +rec.start.split('-')[1]-1, +rec.start.split('-')[2]);
  var wk = Math.max(1, Math.floor((new Date(today) - sd)/86400000/7) + 1);
  document.getElementById('pgWk').textContent = wk + '주차';
  // 연속 금주일 (오늘 또는 어제부터 거슬러 올라가며)
  var streak = 0, cur3 = new Date(today);
  var tday = rec.days[today];
  if(!tday || tday.drink === null || tday.drink === undefined){
    cur3 = new Date(cur3.getFullYear(), cur3.getMonth(), cur3.getDate() - 1);
  }
  for(var g=0; g<400; g++){
    var kk = ymd(cur3);
    var r3 = rec.days[kk];
    if(r3 && r3.drink === 0){ streak++; }
    else break;
    cur3 = new Date(cur3.getFullYear(), cur3.getMonth(), cur3.getDate() - 1);
  }
  // 최고 기록
  var best = 0, run = 0, allk = Object.keys(rec.days).sort();
  var prevD = null;
  allk.forEach(function(k3){
    var r4 = rec.days[k3];
    var dd3 = new Date(k3);
    if(r4 && r4.drink === 0){
      if(prevD && Math.round((dd3 - prevD)/86400000) === 1) run++; else run = 1;
      if(run > best) best = run;
      prevD = dd3;
    } else { run = 0; prevD = null; }
  });
  if(streak > best) best = streak;
  rec.best = best;
  // 연속 운동일
  function streakOf(idx){
    var n2 = 0, c4 = new Date(today);
    var td2 = rec.days[today];
    var has = td2 && td2.checks && td2.checks.indexOf(idx) > -1;
    if(!has) c4 = new Date(c4.getFullYear(), c4.getMonth(), c4.getDate() - 1);
    for(var q=0;q<400;q++){
      var k5 = ymd(c4), r5 = rec.days[k5];
      if(r5 && r5.checks && r5.checks.indexOf(idx) > -1) n2++;
      else break;
      c4 = new Date(c4.getFullYear(), c4.getMonth(), c4.getDate() - 1);
    }
    return n2;
  }
  function bestOf(idx){
    var b2 = 0, r6 = 0, pv = null;
    Object.keys(rec.days).sort().forEach(function(k6){
      var d6 = rec.days[k6], dt6 = new Date(k6);
      if(d6 && d6.checks && d6.checks.indexOf(idx) > -1){
        if(pv && Math.round((dt6 - pv)/86400000) === 1) r6++; else r6 = 1;
        if(r6 > b2) b2 = r6;
        pv = dt6;
      } else { r6 = 0; pv = null; }
    });
    return b2;
  }
  var gs = streakOf(3), gb = Math.max(bestOf(3), gs);
  var ge = document.getElementById('pgGym');
  if(ge) ge.textContent = gs;
  var gbe = document.getElementById('pgGymBest');
  if(gbe) gbe.textContent = gb > 0 ? ('최고 ' + gb + '일') : '';

  document.getElementById('pgDry').textContent = streak;
  var lbl = document.getElementById('pgBest');
  if(lbl) lbl.textContent = best > 0 ? ('최고 ' + best + '일') : '';
}

function stepW(delta){
  var el = document.getElementById('w');
  var base = parseFloat(el.value);
  if(isNaN(base)){
    var prev = null;
    Object.keys(rec.days).sort().forEach(function(k){
      if(rec.days[k] && rec.days[k].w) prev = rec.days[k].w;
    });
    base = prev || 105;
  }
  var v = Math.round(base + delta);
  el.value = v; curDay().w = v; recRender();
}
document.getElementById('wMinus').addEventListener('click', function(){ stepW(-1); });
document.getElementById('wPlus').addEventListener('click', function(){ stepW(1); });

function planSet(t, field, val, orig){
  if(!rec.plan) rec.plan = {};
  if(!rec.plan[today]) rec.plan[today] = {};
  var o = rec.plan[today][t] || {};
  if(!val || val === orig) delete o[field]; else o[field] = val;
  if(!o.x && !o.t) delete rec.plan[today][t]; else rec.plan[today][t] = o;
  recSave(); redrawDay();
}
document.addEventListener('click', function(e){
  var td = e.target.closest('td.edit');
  if(td){
    var v = prompt(td.dataset.t + '에 실제로 한 일', td.textContent);
    if(v !== null) planSet(td.dataset.t, 'x', v.trim(), td.dataset.o);
    return;
  }
  var tt = e.target.closest('td.edtime');
  if(tt){
    var v2 = prompt('시간을 고치세요 (예: 15:30)', tt.textContent);
    if(v2 === null) return;
    v2 = v2.trim();
    if(v2 && !/^\d{1,2}:\d{2}$/.test(v2)){ alert('15:30 처럼 적어주세요.'); return; }
    if(v2 && v2.length === 4) v2 = '0' + v2;
    planSet(tt.dataset.t, 't', v2, tt.dataset.t);
  }
});

document.getElementById('drinks').addEventListener('click', function(e){
  var b = e.target.closest('.d');
  if(!b) return;
  curDay().drink = +b.dataset.v;
  recRender();
});
['w','sys','dia','sleep'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(e){
    var v = e.target.value;
    curDay()[id] = v === '' ? null : +v;
  });
});
document.getElementById('save').addEventListener('click', async function(){
  var st = document.getElementById('status');
  st.textContent = '저장 중…';
  var ok = await recSave();
  st.textContent = ok ? '저장했습니다 · ' + today : '저장이 안 됐습니다. 다시 눌러보세요.';
  recRender();
  if(ok) setTimeout(function(){ st.textContent=''; }, 2500);
});
document.getElementById('csvOut').addEventListener('click', function(){
  var box = document.getElementById('csvBox');
  var L = ['날짜,요일,술,체중,혈압위,혈압아래,잠,메모'];
  var DN = ['일','월','화','수','목','금','토'];
  var DR = ['안마심','절반','평소','더'];
  Object.keys(rec.days).sort().forEach(function(k){
    var r = rec.days[k];
    var d = new Date(+k.split('-')[0], +k.split('-')[1]-1, +k.split('-')[2]);
    L.push([k, DN[d.getDay()],
      (r.drink === null || r.drink === undefined) ? '' : DR[r.drink],
      r.w || '', r.sys || '', r.dia || '', r.sleep || '',
      (r.memo || '').replace(/,/g, ' ')].join(','));
  });
  box.hidden = false;
  box.value = L.join('\n');
  box.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.getElementById('status').textContent = '표를 복사했습니다. 엑셀이나 메모장에 붙여넣으세요.';
});

function applyUser(){
  // 사용자가 넣은 일정 합치기
  MEETS = BASE_MEETS.concat(rec.myMeets || []);
  MEETS = MEETS.filter(function(e){ return !(rec.delMeet && rec.delMeet[e[0]+'|'+e[2]]); });
  // 사용자가 지정한 근무 덮어쓰기
  for(var k in (rec.myRoster||{})) ROSTER[k] = rec.myRoster[k];
  // 할 일 합치기
  TODO = BASE_TODO.map(function(g){
    return [g[0], g[1].filter(function(x){ return !(rec.delTodo && rec.delTodo[x]); })];
  });
  if(rec.myTodo && rec.myTodo.length){
    TODO = TODO.concat([['내가 넣은 것',
      rec.myTodo.filter(function(x){ return !(rec.delTodo && rec.delTodo[x]); })]]);
  }
  rebuild();
}

function rebuild(){
  var nn = new Date();
  var tt0 = new Date(nn.getFullYear(), nn.getMonth(), nn.getDate());
  mt = MEETS.map(function(e){
    var pt = e[0].split('-');
    var dt = new Date(+pt[0], +pt[1]-1, +pt[2]);
    return {d:dt, t:e[1], x:e[2], drink:!!e[4],
            k2:e[0]+'|'+e[2], go:e[5] !== false,
            n:Math.round((dt - tt0)/86400000)};
  }).filter(function(u){ return u.n >= -14; }).sort(function(a,b){
    return a.d - b.d || (a.t < b.t ? -1 : 1);
  });
  try{ drawMeets(); }catch(e){}
  try{ drawTodo(); }catch(e){}
  try{ drawWeek(); }catch(e){}
  try{ redrawDay(); }catch(e){}
}

function msg(t){
  var m = document.getElementById('inMsg');
  m.textContent = t;
  setTimeout(function(){ m.textContent = ''; }, 2500);
}

document.getElementById('inAdd').addEventListener('click', function(){
  var d = document.getElementById('inDate').value;
  var t = document.getElementById('inTime').value;
  var x = document.getElementById('inText').value.trim();
  if(!d || !x){ msg('날짜와 내용을 넣어주세요.'); return; }
  if(!rec.myMeets) rec.myMeets = [];
  rec.myMeets.push([d, t || '', x, 'etc', false]);
  document.getElementById('inText').value = '';
  recSave(); applyUser(); msg('넣었습니다: ' + x);
});

Array.prototype.forEach.call(document.querySelectorAll('.inSm'), function(b){
  b.addEventListener('click', function(){
    var d = document.getElementById('wkDate').value;
    if(!d){ msg('날짜를 먼저 고르세요.'); return; }
    if(!rec.myRoster) rec.myRoster = {};
    rec.myRoster[d] = b.dataset.w;
    recSave(); applyUser();
    msg(d + ' → ' + b.textContent);
  });
});

document.getElementById('tdAdd').addEventListener('click', function(){
  var x = document.getElementById('tdText').value.trim();
  if(!x){ msg('할 일을 적어주세요.'); return; }
  if(!rec.myTodo) rec.myTodo = [];
  rec.myTodo.push(x);
  document.getElementById('tdText').value = '';
  recSave(); applyUser(); msg('넣었습니다: ' + x);
});

document.getElementById('delMeet').addEventListener('click', function(){
  var list = mt.map(function(u,i){
    return (i+1) + '. ' + (u.d.getMonth()+1)+'/'+u.d.getDate()+' ' + u.x;
  }).join('\n');
  var v = prompt('지울 일정 번호를 넣으세요\n\n' + list, '');
  if(!v) return;
  var i = parseInt(v,10) - 1;
  if(isNaN(i) || !mt[i]){ msg('번호가 맞지 않습니다.'); return; }
  var u = mt[i];
  if(!rec.delMeet) rec.delMeet = {};
  rec.delMeet[u.k2] = 1;
  rec.myMeets = (rec.myMeets||[]).filter(function(e){ return e[0]+'|'+e[2] !== u.k2; });
  recSave(); applyUser(); msg('지웠습니다: ' + u.x);
});

document.getElementById('delTodo').addEventListener('click', function(){
  var flat = [];
  TODO.forEach(function(g){ g[1].forEach(function(x){ flat.push(x); }); });
  var list = flat.map(function(x,i){ return (i+1)+'. '+x; }).join('\n');
  var v = prompt('지울 할 일 번호를 넣으세요\n\n' + list, '');
  if(!v) return;
  var i = parseInt(v,10) - 1;
  if(isNaN(i) || !flat[i]){ msg('번호가 맞지 않습니다.'); return; }
  if(!rec.delTodo) rec.delTodo = {};
  rec.delTodo[flat[i]] = 1;
  rec.myTodo = (rec.myTodo||[]).filter(function(x){ return x !== flat[i]; });
  recSave(); applyUser(); msg('지웠습니다: ' + flat[i]);
});

document.getElementById('shareBtn').addEventListener('click', function(){
  var b = this, url = location.origin + location.pathname;
  function ok(){
    var old = b.textContent;
    b.textContent = '복사됨';
    setTimeout(function(){ b.textContent = old; }, 1800);
  }
  if(navigator.share){
    navigator.share({title:'우리집 일정', url:url}).then(ok).catch(function(){});
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(ok).catch(function(){ prompt('아래 주소를 복사하세요', url); });
  } else {
    prompt('아래 주소를 복사하세요', url);
  }
});

recLoad();

})();
